
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Swati ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
text-align:center;
color:white;
overflow-x:hidden;
}

.screen{
padding:20px;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

input{
padding:12px;
font-size:18px;
border:none;
border-radius:10px;
text-align:center;
}

button{
padding:12px 20px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

.hidden{
display:none;
}

img{
width:90%;
max-width:350px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.floating-heart{
position:fixed;
bottom:-20px;
font-size:24px;
animation:float 8s linear infinite;
pointer-events:none;
}

@keyframes float{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-100vh);opacity:0;}
}
</style>
</head>

<body>

<div id="lockScreen" class="screen">
<h1>🎂 Happy Birthday Swati ❤️</h1>
<p>Enter Passcode</p>
<input type="password" id="passcode" placeholder="Passcode">
<button onclick="unlock()">Open ❤️</button>
</div>

<div id="mainContent" class="screen hidden">

<h1>❤️ Swati ❤️</h1>

<h2>📸 Memories</h2>

<img id="slider" src="IMG_20260918_071323_816.jpg">

<br><br>

<button onclick="playMusic()">🎵 Play Music</button>

<audio id="music" preload="auto">
  <source src="inaam-song.mp3" type="audio/mpeg">
</audio>


<h2>💌 From Shubham</h2>

<p>
You are the most beautiful part of my life ❤️<br>
Happy Birthday Swati 🎂🌹
</p>

</div>

<script>

function unlock(){
let code=document.getElementById("passcode").value;

if(code==="143"){
document.getElementById("lockScreen").classList.add("hidden");
document.getElementById("mainContent").classList.remove("hidden");
}
else{
alert("Wrong Passcode ❤️");
}
}

function playMusic(){
  const music = document.getElementById("music");

  music.play().catch(function(error){
    alert("Bhai, inaam-song.mp3 file check karo ❤️");
  });
}

const photos=[
"IMG_20260918_071323_816.jpg",
"IMG_20260918_071311_999.jpg",
"IMG_20260918_071305_113.jpg",
"IMG_20260918_065223_119.jpg"
];

let current=0;

setInterval(()=>{
current=(current+1)%photos.length;
document.getElementById("slider").src=photos[current];
},3000);

function createHeart(){
const heart=document.createElement("div");
heart.innerHTML="❤️";
heart.classList.add("floating-heart");
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);
}

setInterval(createHeart,700);

heart.innerHTML="❤️";
heart.classList.add("floating-heart");
heart.style.left=Math.random()*100+"vw";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);
}

setInterval(createHeart,700);
</script>

</body>
</html>
